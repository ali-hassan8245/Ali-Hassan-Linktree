<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Hassan - Linktree</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500&family=Saira:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden; /* no scroll */
            position: relative;
        }

        h2 {
            font-family: 'Saira', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        body > img {
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            filter: blur(3px) brightness(0.7);
            z-index: -1;
        }

        section {
            display: grid;
            place-items: center;
            height: 100%;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            align-items: center;
        }

        .container img {
            width: 120px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px;
            border: 1.5px solid white;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            transition: 0.25s ease;
            backdrop-filter: blur(6px);
        }

        a:hover {
            background: white;
            color: #8b5d16;
            transform: scale(1.03);
        }

        a i {
            font-size: 1.3em;
        }
    </style>
</head>

<body>

    <img src="lukasz-szmigiel-ps2daRcXYes-unsplash.jpg" alt="bg">

    <section>
        <div class="container">

            <img src="dp1.jpg" alt="dp">
            <h2>Ali Hassan</h2>

            <div class="links">

                <a href="https://www.instagram.com/ali_hassan8245/" target="_blank">
                    <i class="fa-brands fa-instagram"></i>
                    <p>Instagram</p>
                </a>

                <a href="https://www.facebook.com/moreAli.memes1?_rdc=2&_rdr" target="_blank">
                    <i class="fa-brands fa-facebook"></i>
                    <p>Facebook</p>
                </a>

                <a href="https://www.snapchat.com/add/ali_hassan8245" target="_blank">
                    <i class="fa-brands fa-snapchat"></i>
                    <p>Snapchat</p>
                </a>

                <a href="https://x.com/ali_hassan8245" target="_blank">
                    <i class="fa-brands fa-x"></i>
                    <p>X / Twitter</p>
                </a>

                <a href="https://www.linkedin.com/in/alihassanazad8245" target="_blank">
                    <i class="fa-brands fa-linkedin"></i>
                    <p>LinkedIn</p>
                </a>

                <a href="https://github.com/ali-hassan8245" target="_blank">
                    <i class="fa-brands fa-github"></i>
                    <p>GitHub</p>
                </a>

            </div>

        </div>
    </section>

</body>

</html>
